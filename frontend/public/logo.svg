<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ffb830"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="44" fill="#0d1020"/>
  <!-- Scales of justice - simple, clean -->
  <g transform="translate(100,90)" fill="none" stroke="url(#grad)" stroke-width="3" stroke-linecap="round">
    <line x1="-50" y1="-3" x2="50" y2="-3"/>
    <line x1="0" y1="-3" x2="0" y2="40"/>
    <line x1="-8" y1="40" x2="8" y2="40"/>
    <!-- left pan -->
    <path d="M-50-3 L-58 20 M-50-3 L-42 20 M-58 20 L-42 20"/>
    <!-- right pan -->
    <path d="M50-3 L42 20 M50-3 L58 20 M42 20 L58 20"/>
  </g>
  <circle cx="100" cy="87" r="4" fill="url(#grad)"/>
  <!-- AI circuit dots -->
  <circle cx="30" cy="30" r="2.5" fill="#c084fc" opacity="0.4"/>
  <circle cx="170" cy="30" r="2.5" fill="#ffb830" opacity="0.4"/>
  <circle cx="30" cy="170" r="2.5" fill="#ffb830" opacity="0.4"/>
  <circle cx="170" cy="170" r="2.5" fill="#c084fc" opacity="0.4"/>
</svg>
